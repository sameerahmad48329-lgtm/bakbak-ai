<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BakBak AI — Tera Apna Adda</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&family=Baloo+2:wght@600;700&display=swap');

  :root{
    --night: #171a34;
    --night-2: #20244a;
    --card: #262b56;
    --marigold: #f2a93b;
    --marigold-soft: #f2a93b33;
    --mint: #6ee7b7;
    --rose: #f2789b;
    --cream: #f6efe0;
    --muted: #b9bcdc;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1px 1px at 10% 20%, #ffffff55 0, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, #ffffff44 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 60% 70%, #ffffff33 0, transparent 100%),
      radial-gradient(1px 1px at 30% 85%, #ffffff40 0, transparent 100%),
      radial-gradient(1px 1px at 90% 60%, #ffffff33 0, transparent 100%),
      linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
    font-family: 'Inter', sans-serif;
    color: var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 60px;
  }

  .wrap{ width:100%; max-width: 760px; }

  header{ text-align:center; margin-bottom: 22px; }
  .eyebrow{
    font-family:'Baloo 2', sans-serif;
    color: var(--marigold);
    letter-spacing: 2px;
    font-size: 13px;
    text-transform: uppercase;
  }
  h1{
    font-family:'Poppins', sans-serif;
    font-weight: 800;
    font-size: 34px;
    margin: 6px 0 4px;
    background: linear-gradient(90deg, var(--marigold), var(--rose));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline{ color: var(--muted); font-size: 14.5px; margin:0; }

  .personas{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin: 24px 0 18px;
  }
  .persona{
    background: var(--card);
    border: 1.5px solid #3a3f70;
    border-radius: 16px;
    padding: 12px 8px;
    text-align:center;
    cursor:pointer;
    transition: all .2s ease;
    position:relative;
  }
  .persona .emoji{ font-size: 22px; display:block; margin-bottom:6px; }
  .persona .label{ font-family:'Baloo 2'; font-size: 12.5px; font-weight:600; color: var(--muted); }
  .persona:hover{ border-color: var(--marigold-soft); transform: translateY(-2px); }
  .persona.active{
    border-color: var(--marigold);
    box-shadow: 0 0 0 1px var(--marigold), 0 0 18px 2px #f2a93b55;
  }
  .persona.active .label{ color: var(--marigold); }

  .chat-card{
    background: var(--card);
    border: 1px solid #3a3f70;
    border-radius: 20px;
    display:flex;
    flex-direction:column;
    height: 56vh;
    min-height: 380px;
    overflow:hidden;
  }

  .messages{
    flex:1;
    overflow-y:auto;
    padding: 20px;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }
  .msg{ max-width: 82%; padding: 11px 15px; border-radius: 16px; font-size: 14.5px; line-height:1.5; white-space: pre-wrap; }
  .msg.bot{
    align-self:flex-start;
    background: var(--night-2);
    border: 1px solid #3a3f70;
    border-bottom-left-radius: 4px;
  }
  .msg.user{
    align-self:flex-end;
    background: linear-gradient(135deg, var(--marigold), #e08a2b);
    color: #201400;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }
  .msg.typing{ color: var(--muted); font-style:italic; }

  .empty-hint{
    margin: auto;
    text-align:center;
    color: var(--muted);
    font-size: 14px;
    padding: 20px;
  }

  .input-row{
    display:flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid #3a3f70;
    background: var(--night-2);
  }
  textarea{
    flex:1;
    resize:none;
    background: var(--night);
    border: 1px solid #3a3f70;
    border-radius: 12px;
    color: var(--cream);
    padding: 11px 13px;
    font-family:'Inter';
    font-size: 14.5px;
    line-height:1.4;
    max-height: 100px;
  }
  textarea:focus{ outline:none; border-color: var(--marigold); }
  button.send{
    background: var(--marigold);
    color: #201400;
    border:none;
    border-radius: 12px;
    padding: 0 20px;
    font-family:'Baloo 2';
    font-weight:700;
    font-size: 14px;
    cursor:pointer;
    transition: transform .15s ease, filter .15s ease;
  }
  button.send:hover{ filter: brightness(1.08); transform: translateY(-1px); }
  button.send:disabled{ opacity:.5; cursor:not-allowed; }

  footer{ text-align:center; color: #7a7fae; font-size: 12px; margin-top: 18px; }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-thumb{ background: #3a3f70; border-radius: 8px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Adda Shuru Karo</div>
    <h1>BakBak AI</h1>
    <p class="tagline">Ek chatbot, chaar mood — jo bhi chahiye, bas chun lo</p>
  </header>

  <div class="personas" id="personas"></div>

  <div class="chat-card">
    <div class="messages" id="messages">
      <div class="empty-hint" id="emptyHint">Upar se apna mood chuno, phir neeche type karo — main sun raha hoon 👇</div>
    </div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Yahan likho..."></textarea>
      <button class="send" id="sendBtn">Bhej</button>
    </div>
  </div>

  <footer>BakBak AI apni raay deta hai, expert advice nahi — zaroori faislon ke liye asli insaan se baat karo.</footer>
</div>

<script>
const PERSONAS = [
  {
    id: 'padhai',
    emoji: '📚',
    label: 'Padhai',
    system: "Tum ek dost jaisa study-helper ho, jo Hinglish mein baat karta hai — thoda casual, thoda motivating, lekin explanation clear aur sahi hota hai. Students ko concepts (school, competitive exams, coding doubts) simple examples ke saath samjhao. Zyada lamba lecture mat do — seedha point pe aao, phir ek chhota example do. Agar sawaal galat ya ambiguous ho to politely puchho."
  },
  {
    id: 'dosti',
    emoji: '🤝',
    label: 'Dosti',
    system: "Tum ek caring, samajhdar dost ho jo Hinglish mein baat karta hai. User apni feelings, rishtey, dosti ya relationship ke baare mein baat karega — tum unhe sunte ho, judge nahi karte, aur emotionally warm rehte ho. Halki si desi dost wali zubaan use karo lekin gyaan mat jhaado — bas saath do aur practical, kind salah do jab maango. Agar koi cheez serious lage (mental health, self-harm), to gently professional help suggest karo."
  },
  {
    id: 'business',
    emoji: '💡',
    label: 'Business',
    system: "Tum ek practical business/startup mentor ho jo Hinglish mein baat karta hai, India ke market context ko dhyan mein rakhte hue. User ko startup ideas, marketing, ya business problems mein seedhi, actionable salah do — filmy motivation nahi, real steps do. Numbers aur examples ka use karo jab relevant ho. Zyada lamba mat likho, bullet-style seedha jawab do."
  },
  {
    id: 'motivation',
    emoji: '✨',
    label: 'Motivation',
    system: "Tum ek warm, spiritual-ish motivator ho jo Hinglish mein baat karta hai — thoda shayari, thoda desi wisdom, lekin real aur grounded, filmy overacting nahi. User ko unke mood ke hisaab se ek chhota, sachcha motivational jawab do — kabhi kabhi ek quote ya analogy use karo. Zyada lamba mat karo, dil se aur seedha likho."
  }
];

let activePersona = PERSONAS[0];
let history = [];

const personasEl = document.getElementById('personas');
const messagesEl = document.getElementById('messages');
const emptyHint = document.getElementById('emptyHint');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

function renderPersonas(){
  personasEl.innerHTML = '';
  PERSONAS.forEach(p => {
    const div = document.createElement('div');
    div.className = 'persona' + (p.id === activePersona.id ? ' active' : '');
    div.innerHTML = `<span class="emoji">${p.emoji}</span><span class="label">${p.label}</span>`;
    div.onclick = () => {
      if (activePersona.id !== p.id){
        activePersona = p;
        history = [];
        messagesEl.innerHTML = '';
        messagesEl.appendChild(emptyHint);
        renderPersonas();
      }
    };
    personasEl.appendChild(div);
  });
}
renderPersonas();

function addMessage(text, role){
  if (emptyHint.parentNode) emptyHint.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  sendBtn.disabled = true;

  addMessage(text, 'user');
  history.push({ role: 'user', content: text });

  const typingDiv = addMessage('BakBak AI likh raha hai...', 'bot typing');

  try{
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system: activePersona.system,
        messages: history
      })
    });
    const data = await response.json();
    const reply = (data.content || []).map(b => b.text || '').join('\n').trim() || "Kuch gadbad ho gayi, dobara try karo.";
    typingDiv.remove();
    addMessage(reply, 'bot');
    history.push({ role: 'assistant', content: reply });
  } catch(err){
    typingDiv.remove();
    addMessage("Network mein dikkat aa gayi, thodi der baad try karo.", 'bot');
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.onclick = sendMessage;
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});
</script>

</body>
</html>
